name: Publish fahali to PyPI

# Secret-free publishing via PyPI Trusted Publishing (OIDC).
# No API token is stored anywhere: GitHub mints a short-lived OIDC token that
# PyPI trusts, so there is nothing to leak or rotate.
#
# ONE-TIME SETUP (no secret involved):
#   pypi.org -> your account -> the `fahali` project -> Publishing ->
#   "Add a new trusted publisher (GitHub)":
#     Owner:        Future-Legends-Inc
#     Repository:   fahali-integrations
#     Workflow:     publish-pypi.yml
#     Environment:  pypi
#
# THEN publish by cutting a GitHub Release (or run this workflow manually).
# Bump py/pyproject.toml version first — PyPI rejects re-uploading a version.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for OIDC; no PyPI token needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build sdist + wheel
        working-directory: py
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: py/dist
